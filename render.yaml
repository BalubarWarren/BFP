envVarGroups:
  - name: cron-secret
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: bfp-benguet-reporting-system
    runtime: node
    plan: free
    rootDir: bfp-benguet-reporting-system
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVarGroups:
      - cron-secret
    envVars:
      - key: NODE_VERSION
        value: 20.18.1 # Pinned to a stable LTS — leaving this unset let Render pick whatever
        # newest Node is currently available (was 26.8.1, a non-LTS version released long after
        # this Next.js 13 app was built), which caused inexplicable module-resolution build
        # failures that don't reproduce on any actively-tested Node version.
      - key: DATABASE_URL
        sync: false # Set manually in the Render dashboard to the Supabase Postgres connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "BFP Benguet Reporting <onboarding@resend.dev>"
      - key: SUPABASE_URL
        sync: false # Set manually in the Render dashboard — same Supabase project as DATABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Secret — Project Settings > API > service_role in the Supabase dashboard

  # Runs daily and just curls the web app's own endpoint rather than querying the database
  # directly. This was originally required because Cron Job services get an isolated filesystem
  # and couldn't see the web service's local SQLite file; now that the database is Postgres
  # (network-accessible from anywhere), this indirection isn't strictly necessary anymore, but the
  # pattern still works fine as-is. See app/api/cron/check-overdue/route.js.
  # Target moved from the Render web service to Vercel (bfp-gamma.vercel.app) since the app itself
  # is now hosted there — Render's free web service sleeps after 15 min idle, which isn't
  # acceptable for a system meant to be reachable 24/7. This cron job is the one piece kept on
  # Render, since it needs nothing more than the ability to fire an HTTP request on a schedule.
  - type: cron
    name: bfp-overdue-report-check
    runtime: image
    image:
      url: docker.io/curlimages/curl:latest
    plan: free
    schedule: "0 1 * * *"
    envVarGroups:
      - cron-secret
    dockerCommand: >-
      curl -fsS -X POST https://bfp-gamma.vercel.app/api/cron/check-overdue
      -H "Authorization: Bearer $CRON_SECRET"
